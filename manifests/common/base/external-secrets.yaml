apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: correspondence-azure-kv
  namespace: product-correspondence
  labels:
    app.kubernetes.io/part-of: correspondence
spec:
  provider:
    azurekv:
      authType: WorkloadIdentity
      vaultUrl: ${CORRESPONDENCE_KEY_VAULT_URL}
      serviceAccountRef:
        name: correspondence-secrets
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: correspondence-secrets
  labels:
    app.kubernetes.io/part-of: correspondence
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: correspondence-azure-kv
  target:
    name: correspondence-secrets
    creationPolicy: Owner
  data:
    - secretKey: platform-subscription-key
      remoteRef:
        key: platform-subscription-key
    - secretKey: access-management-subscription-key
      remoteRef:
        key: access-management-subscription-key
    - secretKey: maskinporten-client-id
      remoteRef:
        key: maskinporten-client-id
    - secretKey: maskinporten-jwk
      remoteRef:
        key: maskinporten-jwk
    - secretKey: slack-url
      remoteRef:
        key: slack-url
    - secretKey: altinn-idprovider-client-id
      remoteRef:
        key: altinn-idprovider-client-id
    - secretKey: altinn-idprovider-client-secret
      remoteRef:
        key: altinn-idprovider-client-secret
    - secretKey: statistics-api-key
      remoteRef:
        key: statistics-api-key
    - secretKey: malware-scan-bypass-white-list
      remoteRef:
        key: malware-scan-bypass-white-list
    - secretKey: correspondence-ado-connection-string
      remoteRef:
        key: correspondence-ado-connection-string
    - secretKey: correspondence-migration-connection-string
      remoteRef:
        key: correspondence-migration-connection-string
    - secretKey: storage-connection-string
      remoteRef:
        key: storage-connection-string
    - secretKey: redis-connection-string
      remoteRef:
        key: redis-connection-string
    - secretKey: application-insights-connection-string
      remoteRef:
        key: application-insights-connection-string
